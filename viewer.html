<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PDF翻訳ビューア</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <span id="filename"></span>
    <button id="openOriginal" title="翻訳せずに、いつものビューア（Chrome標準や Google Scholar など）で開きます" hidden>↩ 通常のビューアで開く</button>
    <label>原文
      <select id="src">
        <option value="en">英語</option>
        <option value="zh">中国語</option>
        <option value="ko">韓国語</option>
        <option value="fr">フランス語</option>
        <option value="de">ドイツ語</option>
        <option value="es">スペイン語</option>
        <option value="ru">ロシア語</option>
        <option value="ja">日本語</option>
      </select>
    </label>
    <label>訳
      <select id="dst">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="zh">中国語</option>
        <option value="ko">韓国語</option>
      </select>
    </label>
    <button id="startLocal" class="translate-button" aria-busy="false" title="Chrome内蔵AIで翻訳します。文章は外部に送られません。">ローカルAIで翻訳</button>
    <button id="startGemini" class="translate-button" aria-busy="false" title="PDF全文をGemini APIへ送って翻訳します。APIキーが必要です。">Geminiで翻訳</button>
    <label>表示
      <select id="view">
        <option value="both">対訳（左右）</option>
        <option value="ja">日本語訳のみ</option>
        <option value="orig">原文のみ</option>
      </select>
    </label>
    <span class="zoom-controls" role="group" aria-label="表示倍率">
      <span class="zoom">
        <button id="zoomOut" title="縮小">−</button>
        <button id="zoomReset" title="100%に戻す"><span id="zoomLabel">100%</span></button>
        <button id="zoomIn" title="拡大">＋</button>
      </span>
      <span class="zoom-fit">
        <button id="fitWidth" title="タブの横幅に合わせる（対訳では左右2ページ）" aria-label="幅に合わせる" aria-pressed="false">↔ 幅</button>
        <button id="fitHeight" title="現在のページをタブの高さに合わせる" aria-label="高さに合わせる" aria-pressed="false">↕ 高さ</button>
      </span>
    </span>
    <button id="download" title="今の表示のままPDFに保存します">PDFで保存</button>
    <button id="openSettings" title="GeminiのAPIキー・モデルの設定">⚙ 設定</button>
    <span id="status" role="status" aria-live="polite"></span>
  </header>

  <dialog id="settings">
    <form method="dialog">
      <h2>Gemini APIの設定</h2>

      <div class="gemini-only">
        <div class="field">
          <span class="name">APIキー</span>
          <div class="row-input">
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
            <button type="button" id="toggleKey">表示</button>
            <button type="button" id="clearKey">削除</button>
          </div>
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">APIキーを取得する（Google AI Studio）</a>
        </div>
        <div class="field">
          <span class="name">モデル</span>
          <input id="model" list="modelList" spellcheck="false">
          <datalist id="modelList">
            <option value="gemini-3.5-flash-lite">無料枠の回数重視（おすすめ）</option>
            <option value="gemini-3.8-flash">通常のFlash</option>
          </datalist>
        </div>
        <div class="field">
          <button type="button" id="testKey">接続テスト</button>
          <span id="testResult"></span>
        </div>
        <p class="note">⚠ Gemini APIの<b>無料枠</b>では、送った文章がGoogleのサービス改善に使われ、人が読む場合があります。未公開の論文など外に出したくない文書には「ローカルAIで翻訳」を使ってください。</p>
        <p class="note">APIキーはこのブラウザの、この拡張機能専用の保存領域にだけ保存され、Gemini API以外には送られません。</p>
      </div>

      <menu>
        <button value="cancel" formnovalidate>キャンセル</button>
        <button value="save" class="primary">保存</button>
      </menu>
    </form>
  </dialog>
  <main id="pages"></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
